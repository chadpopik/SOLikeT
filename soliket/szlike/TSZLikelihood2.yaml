        value: 0
        # ref: 0.0393
        # prior:
        #     min: -5
        #     max: 30.0
    alphaz_beta:
        latex: \alpha_z^{\beta}
        value: 0
        # ref: 0.415
        # prior:
        #     min: 0.1
        #     max: 30.0
    A2h:
        latex: A_{2h}
        ref: 1.0
        prior:
            min: 0
            max: 5


    redshift: 
        value: 0.55 
    mass_halo_mean_Msol:
