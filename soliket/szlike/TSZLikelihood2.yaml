# Have to outline all input parameters/files used in the likelihood and model, even if you want to override them later

params:
    A0_P0:
        latex: A_0^{P_0}
        ref: 2
        prior:
            min: 0.1
            max: 30.0
    alpham_P0:
        latex: \alpha_m^{P_0}
        value: 0
        ref: 0.154
        prior:
            min: 0.1
            max: 30.0
    alphaz_P0:
        latex: \alpha_z^{P_0}
        value: 0
