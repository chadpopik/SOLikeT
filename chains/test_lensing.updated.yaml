theory:
  camb:
    version: 1.5.2
    path: null
    speed: 0.3
    stop_at_error: false
    extra_args:
      lens_potential_accuracy: 1
    ignore_obsolete: false
    use_renames: false
    external_primordial_pk: false
    renames:
      omegabh2: ombh2
      omegach2: omch2
      omegal: omega_de
      omegak: omk
      yhe: YHe
      yheused: YHe
      YpBBN: Y_p
    input_params:
    - As
    - ns
    - cosmomc_theta
    - ombh2
    - omch2
    - Alens
    - tau
    output_params:
    - H0
    - sigma8
likelihood:
  soliket.LensingLiteLikelihood:
    kind: pp
    lmax: 3000
    datapath: /global/u2/c/cpopik/Packages/SOLikeT/soliket/lensing/data/binnedauto.txt
    covpath: /global/u2/c/cpopik/Packages/SOLikeT/soliket/lensing/data/binnedcov.txt
    binning_matrix_path: /global/u2/c/cpopik/Packages/SOLikeT/soliket/lensing/data/binningmatrix.txt
    name: TT
    ncovsims: null
    type: []
    speed: -1
    stop_at_error: true
    version: null
    input_params: []
    output_params: []
params:
  cosmomc_theta:
    prior:
      min: 0.0103
      max: 0.0105
    proposal: 1.5e-06
    latex: \theta_\mathrm{MC}
  logA:
    prior:
      min: 2.6
      max: 3.5
    proposal: 0.0036
    drop: true
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
  ns:
    prior:
      min: 0.9
      max: 1.1
    proposal: 0.0033
    latex: n_\mathrm{s}
  ombh2:
    prior:
      min: 0.017
      max: 0.027
    proposal: 6.5e-05
    latex: \Omega_\mathrm{b}h^2
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.09
      max: 0.15
    proposal: 0.0011
    latex: \Omega_\mathrm{c}h^2
    renames:
    - omegach2
  Alens:
    prior:
      min: 0.5
      max: 1.5
    proposal: 0.022
    latex: A_\mathrm{L}
  tau:
    prior:
      dist: norm
      loc: 0.0544
      scale: 0.0073
    proposal: 0.0073
    latex: \tau_\mathrm{reio}
  H0:
    latex: H_0
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
sampler:
  mcmc:
    burn_in: 0
    max_tries: 1000
    covmat: null
    covmat_params: null
    proposal_scale: 2.4
    output_every: 60s
    learn_every: 40d
    temperature: 1
    learn_proposal: true
    learn_proposal_Rminus1_max: 2.0
    learn_proposal_Rminus1_max_early: 30.0
    learn_proposal_Rminus1_min: 0.0
    max_samples: 10
    Rminus1_stop: 0.01
    Rminus1_cl_stop: 0.2
    Rminus1_cl_level: 0.95
    Rminus1_single_split: 4
    measure_speeds: true
    oversample_power: 0.4
    oversample_thin: true
    drag: false
    blocking:
    - - 1
      - - cosmomc_theta
        - ombh2
        - omch2
        - Alens
        - tau
    - - 1
      - - logA
        - ns
    callback_function: null
    callback_every: null
    seed: null
    check_every: null
    oversample: null
    drag_limits: null
    fallback_covmat_scale: 4
    version: '3.3'
output: test_lensing
version: '3.3'
